[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # pinned so newer ruff defaults do not change CI
# The existing code uses compact one-liners (`import a, b`, `if x: y`); allow that style.
ignore = ["E401", "E701", "E702"]
